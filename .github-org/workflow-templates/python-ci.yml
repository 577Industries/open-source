# 577Industries house CI shape for a Python library (starter workflow).
# Every job carries timeout-minutes; every scheduled workflow carries
# workflow_dispatch (a lock-killed cron can otherwise only self-heal at its
# next tick); concurrency cancels superseded pull-request runs only.
# Pair it with .github/dependabot.yml: pip weekly (open-pull-requests-limit 5)
# + github-actions monthly with a single `github-actions` group.
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    - cron: '17 6 * * 1'  # weekly Monday 06:17 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install '.[dev]'
      - run: pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit --strict --skip-editable
        continue-on-error: true
