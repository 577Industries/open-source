site_name: HELIOS
site_description: Heliophysics-Enhanced Location Integrity and Operations System — 577 Industries NASA SBIR Phase I (subtopic SPWX.1.S26A)
site_url: https://577industries.github.io/helios-program/
site_author: 577 Industries Inc.
repo_url: https://github.com/577Industries/helios-program
repo_name: 577Industries/helios-program
edit_uri: edit/main/
copyright: >-
  Copyright &copy; 2026 577 Industries Inc. — Apache 2.0 license. NASA SBIR Phase I work; no NASA endorsement implied.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      separator: '[\s\-\.]+'
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      categories: true
      categories_url_format: "category/{slug}"
      authors: true
      authors_file: "{blog}/.authors.yml"
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date
      fallback_to_build_date: true
  - include-markdown
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/577Industries
      name: 577 Industries on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/577-industries/
      name: 577 Industries on LinkedIn
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js

nav:
  - Home: index.md
  - Proposal Companion: companion.md
  - Blog:
      - blog/index.md
  - Master Plan: master-plan.md
  - Operations Guide: operations.md
  - OSF Pre-Registration Template: osf-preregistration-template.md
  - Review Packs:
      - "Artifact A — Provenance Spec": specs/A-provenance-spec.md
      - "Artifact B — Connectors + DONKI": specs/B-connectors-foundation.md
      - "Artifact C — Fusion-Engine Framework": specs/C-fusion-engine-framework.md
      - "Artifact D — Gannon Analysis": specs/D-gannon-analysis.md
  - Phase II:
      - "Overview": phase-ii/index.md
      - "Evidence Package": phase-ii/evidence-package.md
      - "Commercialization Plan (Refined)": phase-ii/commercialization-plan-refined.md
      - "Phase II Proposal (Scaffold)": phase-ii/phase-ii-proposal-draft.md
